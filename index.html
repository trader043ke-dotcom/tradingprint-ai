    <title>Automate Your Trades | Deriv Bot</title>
    <style>
      :root {
        font-size: 62.5%;
      }
      
      /* --- ENHANCED: Cyber Neon Title Splash Screen with Progress Bar --- */
      .splash-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #0b0e14; /* Deep cyber dark background */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100000;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
      }
      
      .splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-content-box {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .animated-title {
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 3.8rem;
        font-weight: 800;
        letter-spacing: 3px;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(15px);
        animation: fadeInUpReveal 2.2s ease-in-out forwards;
      }

      .animated-title span {
        color: #00ff87; /* Emerald Cyber Neon Green */
        text-shadow: 0 0 20px rgba(0, 255, 135, 0.7);
      }

      /* Cyber Loading Bar Container */
      .progress-container {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        overflow: hidden;
        opacity: 0;
        animation: fadeInProgressBar 0.5s ease-out 0.3s forwards;
      }

      /* Animated Filling Line */
      .progress-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00ff87, #60efff);
        box-shadow: 0 0 10px rgba(0, 255, 135, 0.5);
        border-radius: 10px;
        animation: loadProgress 1.6s cubic-bezier(0.1, 0.8, 0.3, 1) 0.4s forwards;
      }

      @keyframes fadeInUpReveal {
        0% {
          opacity: 0;
          transform: translateY(15px);
          filter: blur(4px);
        }
        20% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
        80% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-15px);
          filter: blur(4px);
        }
      }

      @keyframes fadeInProgressBar {
        to { opacity: 1; }
      }

      @keyframes loadProgress {
        0% { width: 0%; }
        100% { width: 100%; }
      }

      /* Custom Styles for UI Panels */
      .ai-extension-container {
        position: fixed;
        bottom: 100px;
        right: 20px;
        width: 320px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
        overflow: hidden;
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 0.5s ease-out, transform 0.5s ease;
      }
      
      .ai-extension-container.visible {
        opacity: 1;
        transform: scale(1);
      }
      
      .ai-header {
        background: #111827; 
        color: white;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #00ff87;
      }
      .ai-body {
        padding: 16px;
      }
      .section-title {
        font-size: 12px;
        text-transform: uppercase;
        color: #6b7280;
        margin-bottom: 8px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .loader-zone {
        border: 2px dashed #00ff87;
        border-radius: 8px;
        padding: 16px;
        text-align: center;
        background: #fdfdfd;
        cursor: pointer;
        margin-bottom: 16px;
        transition: all 0.2s;
      }
      .loader-zone:hover {
        background: rgba(0, 255, 135, 0.04);
        border-color: #00e074;
      }
      .loader-zone p {
        margin: 0;
        font-size: 12px;
        color: #4b5563;
      }
      .scanner-status {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        font-size: 12px;
        color: #1f2937;
      }
      .scanner-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .scanner-row:last-child {
        margin-bottom: 0;
      }
      .badge {
        background: #00ff87;
        color: #0b0e14;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: bold;
        text-shadow: none;
      }
      .hidden-input {
        display: none;
      }
    </style>
  </head>
  
  <body class="body theme theme--light">

    <noscript>
      <iframe src="https://googletagmanager.com" height="0" width="0" style="display: none; visibility: hidden"></iframe>
    </noscript>

    <!-- NEW: Cyber Neon Splash Intro Screen with Custom Progress Bar -->
    <div id="splashScreen" class="splash-overlay">
      <div class="splash-content-box">
        <div class="animated-title">Tradingprint <span>AI</span></div>
        <div class="progress-container">
          <div class="progress-bar-fill"></div>
        </div>
      </div>
    </div>
    
    <div id="modal_root" class="modal-root"></div>
    <div id="popup_root" class="popup-root"></div>
    <div id="root"></div>

    <!-- AI Scanner & Bot Loader UI Panel -->
    <div class="ai-extension-container" id="aiPanel">
      <div class="ai-header">
        <span>🤖 Tradingprint AI Modules</span>
        <span style="font-size: 11px; color: #00ff87; font-weight: bold;">ONLINE</span>
      </div>
      <div class="ai-body">
        <!-- Bot Loader Section -->
        <div class="section-title">Strategy Engine Loader</div>
        <div class="loader-zone" onclick="document.getElementById('botFileInput').click()">
          <p>📄 <strong>Click to load strategy file</strong></p>
          <p style="font-size: 10px; color: #9ca3af; margin-top: 4px;">Supports XML or JSON bot configurations</p>
          <input type="file" id="botFileInput" class="hidden-input" accept=".xml,.json" onchange="handleBotUpload(this)">
        </div>

        <!-- AI Scanner Section -->
        <div class="section-title">AI Live Market Scanner</div>
        <div class="scanner-status">
          <div class="scanner-row">
            <span>Market Volatility:</span>
            <span style="font-weight: 600; color: #00e074;">Optimal</span>
          </div>
          <div class="scanner-row">
            <span>AI Signal Trend:</span>
            <span class="badge">STRONG BUY</span>
          </div>
          <div class="scanner-row">
            <span>Scan Accuracy:</span>
            <span style="color: #00e074; font-weight: 600;">94.2%</span>
          </div>
        </div>
      </div>
    </div>
