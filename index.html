    <title>Automate Your Trades | Tradingprint AI</title>
    
    <style>
      :root {
        font-size: 62.5%;
        --tp-bg: #081B33;
        --tp-navy-dark: #051224;
        --tp-cyan: #22D3EE;
        --tp-violet: #7C3AED;
        --tp-white: #F8FAFC;
        --tp-muted: #94A3B8;
        --tp-amber: #F59E0B;
        --tp-success: #10B981;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--tp-bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }

      .tp-main-interface-shell {
        display: flex;
        width: 100%;
        height: 100vh;
        position: relative;
        z-index: 10;
      }

      /* ==========================================================================
         OUTER LAYER: PRODUCTION SIDEBAR PANEL (AI SCANNER ENGINE)
         ========================================================================== */
      .tp-ai-scanner-sidebar {
        width: 320px;
        background-color: var(--tp-navy-dark);
        border-right: 1px solid rgba(34, 211, 238, 0.15);
        display: flex;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
        flex-shrink: 0;
      }

      .sidebar-title {
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--tp-cyan);
        margin: 0;
        letter-spacing: -0.5px;
      }

      .sidebar-subtitle {
        font-size: 1.1rem;
        color: var(--tp-muted);
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .scanner-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(34, 211, 238, 0.1);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
      }

      .scanner-card h4 {
        margin: 0 0 12px 0;
        font-size: 1.3rem;
        color: var(--tp-white);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .pulse-indicator {
        width: 8px;
        height: 8px;
        background-color: var(--tp-muted);
        border-radius: 50%;
      }
      .pulse-indicator.active {
        background-color: var(--tp-amber);
        box-shadow: 0 0 8px var(--tp-amber);
        animation: tpGlitchPulse 1.5s infinite;
      }
      @keyframes tpGlitchPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

      .metric-row {
        display: flex;
        justify-content: space-between;
        font-size: 1.1rem;
        margin-bottom: 8px;
        color: var(--tp-muted);
      }
      .metric-row span.v {
        color: var(--tp-white);
        font-weight: 600;
      }

      .action-btn {
        width: 100%;
        font-size: 1.3rem;
        font-weight: 700;
        padding: 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1.5px solid transparent;
        margin-bottom: 10px;
        box-sizing: border-box;
      }

      .btn-scan {
        background-color: var(--tp-violet);
        color: var(--tp-white);
      }
      .btn-scan:hover { background-color: #6d28d9; }

      .progress-container {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.05);
        border-radius: 2px;
        overflow: hidden;
        margin: 10px 0;
        display: none;
      }
      .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--tp-cyan), var(--tp-violet));
      }

      .result-box {
        margin-top: 10px;
        padding: 10px;
        border-radius: 4px;
        background: rgba(16, 185, 129, 0.05);
        border: 1px dashed var(--tp-success);
        display: none;
        font-size: 1.2rem;
        text-align: center;
      }

      /* Inner Menu Dynamic Strategy Injector Styling */
      .tp-inner-menu-section {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .tp-inner-menu-header {
        font-weight: bold;
        color: var(--tp-cyan);
        padding: 8px 16px;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .tp-strategy-option-item {
        padding: 10px 16px;
        color: var(--tp-white);
        font-size: 1.2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: background-color 0.2s;
      }
      .tp-strategy-option-item:hover {
        background-color: rgba(34, 211, 238, 0.1);
        color: var(--tp-cyan);
      }

      .tp-underlying-app-viewport {
        flex: 1;
        height: 100%;
        position: relative;
        background-color: var(--tp-white);
        overflow: auto;
      }

      @media (max-width: 768px) {
        .tp-main-interface-shell { flex-direction: column; }
        .tp-ai-scanner-sidebar { width: 100%; height: 35%; border-right: none; border-bottom: 1px solid rgba(34, 211, 238, 0.15); }
        .tp-underlying-app-viewport { height: 65%; }
      }

      /* ==========================================================================
         OUTER LAYER: WELCOME & ONBOARDING SYSTEM MASK
         ========================================================================== */
      .tp-split-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--tp-bg);
        background-image: radial-gradient(circle at 30% 50%, rgba(34, 211, 238, 0.12), rgba(124, 58, 237, 0.08) 60%, transparent 100%);
        z-index: 99999;
        display: flex;
        box-sizing: border-box;
        transition: opacity 0.6s ease, visibility 0.6s;
      }
      .tp-split-overlay.dismissed { opacity: 0; visibility: hidden; pointer-events: none; }
      .tp-anim-panel { flex: 1.2; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 60px; box-sizing: border-box; }
      .logo-box { position: relative; margin-bottom: 20px; }
      .tp-animated-logo { font-size: 4.8rem; font-weight: 900; color: var(--tp-white); letter-spacing: -1.5px; margin: 0; background: linear-gradient(120deg, var(--tp-white) 30%, var(--tp-cyan) 50%, var(--tp-white) 70%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: lightSweep 3.5s linear infinite; }
      @keyframes lightSweep { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }
      .ai-pulse-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 115%; height: 115%; border: 2px solid var(--tp-violet); border-radius: 8px; opacity: 0; animation: aiPulse 3s ease-out infinite; }
      @keyframes aiPulse { 0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0; } 50% { opacity: 0.4; } 100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0; } }
      .chart-wave-container { width: 100%; max-width: 400px; height: 50px; margin-bottom: 25px; overflow: hidden; }
      .moving-graph-line { width: 200%; height: 100%; animation: continuousWave 12s linear infinite; }
      @keyframes continuousWave { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
      .welcome-message-ticker { font-size: 1.8rem; font-weight: 500; color: var(--tp-cyan); min-height: 30px; letter-spacing: 0.5px; animation: textPulse 2.5s ease-in-out infinite; }
      @keyframes textPulse { 0%, 100% { opacity: 0.6; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
      .tp-auth-panel { flex: 0.8; background-color: #051224; border-left: 1px solid rgba(34, 211, 238, 0.15); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; box-sizing: border-box; }
      .auth-card { width: 100%; max-width: 320px; text-align: center; }
      .auth-card h3 { color: var(--tp-white); font-size: 2.2rem; margin-bottom: 10px; font-weight: 700; }
      .auth-card p { color: var(--tp-muted); font-size: 1.3rem; margin-bottom: 30px; line-height: 1.5; }
      .tp-dragged-btn { width: 100%; font-size: 1.4rem; font-weight: 600; padding: 14px; border-radius: 6px; cursor: pointer; margin-bottom: 12px; transition: all 0.2s ease; box-sizing: border-box; border: 2px solid transparent; display: block; text-align: center; text-decoration: none; }
