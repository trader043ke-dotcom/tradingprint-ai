    <title>TradingPrint AI | Live Real-Money Trading Terminal</title>
    
    <style>
      :root {
        font-size: 62.5%;
        --tp-bg: #081B33;
        --tp-navy-dark: #051224;
        --tp-cyan: #22D3EE;
        --tp-violet: #7C3AED;
        --tp-white: #F8FAFC;
        --tp-muted: #94A3B8;
        --tp-amber: #F59E0B;
        --tp-red: #EF4444;
        --tp-success: #10B981;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--tp-bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }

      .tp-main-interface-shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        position: relative;
        z-index: 10;
      }

      /* ==========================================================================
         OUTER LAYER: SYSTEM NAVIGATION BAR WITH BRANDING GRADIENT
         ========================================================================= */
      .tp-header-navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 24px;
        background-color: var(--tp-navy-dark);
        border-bottom: 1px solid rgba(34, 211, 238, 0.25);
        box-sizing: border-box;
        position: relative;
        z-index: 100000;
      }

      .animated-title {
        font-size: 2.2rem;
        font-weight: 900;
        letter-spacing: -0.5px;
        margin: 0;
        background: linear-gradient(120deg, var(--tp-cyan) 15%, var(--tp-white) 40%, var(--tp-violet) 65%, var(--tp-cyan) 85%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: tpTitleShimmer 4s linear infinite;
      }

      @keyframes tpTitleShimmer {
        0% { background-position: 200% center; }
        100% { background-position: -200% center; }
      }

      .auth-buttons-group {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .nav-btn {
        font-size: 1.3rem;
        font-weight: 700;
        padding: 8px 18px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        text-decoration: none;
        border: 2px solid transparent;
        box-sizing: border-box;
      }

      .btn-login {
        color: var(--tp-white);
        background-color: transparent;
        border-color: rgba(248, 250, 252, 0.2);
      }
      .btn-login:hover {
        color: var(--tp-cyan);
        background-color: rgba(34, 211, 238, 0.05);
        border-color: var(--tp-cyan);
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.15);
      }

      .btn-signin {
        color: var(--tp-navy-dark);
        background-color: var(--tp-cyan);
      }
      .btn-signin:hover {
        background-color: #1ec2db;
        color: var(--tp-white);
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
      }

      .tp-workspace-split-container {
        display: flex;
        flex: 1;
        width: 100%;
        overflow: hidden;
        height: calc(100vh - 59px);
      }

      /* ==========================================================================
         INNER SIDEBAR LAYER: CORE ACCOUNT & TELEMETRY CONTROLS
         ========================================================================== */
      .tp-ai-scanner-sidebar {
        width: 320px;
        background-color: var(--tp-navy-dark);
        border-right: 1px solid rgba(34, 211, 238, 0.15);
        display: flex;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
        flex-shrink: 0;
      }

      .sidebar-subtitle {
        font-size: 1.1rem;
        color: var(--tp-cyan);
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
      }

      .scanner-card {
        background: rgba(8, 27, 51, 0.6);
        border: 1px solid rgba(34, 211, 238, 0.2);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
      }

      .scanner-card h4 {
        margin: 0 0 12px 0;
        font-size: 1.3rem;
        color: var(--tp-white);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding-bottom: 5px;
      }

      .metric-row {
        display: flex;
        justify-content: space-between;
        font-size: 1.1rem;
        margin-bottom: 8px;
        color: var(--tp-muted);
      }
      .metric-row span.v {
        color: var(--tp-white);
        font-weight: 600;
      }

      .live-badge {
        background-color: rgba(239, 68, 68, 0.15);
        color: var(--tp-red);
        border: 1px solid var(--tp-red);
        font-size: 0.9rem;
        padding: 2px 6px;
        border-radius: 3px;
        font-weight: bold;
      }

      /* ==========================================================================
         INNER CONTAINER: TERMINAL CONTROL ROOM (EXACT MATRIX SPEC MATCH)
         ========================================================================== */
      .tp-underlying-app-viewport {
        flex: 1;
        height: 100%;
        position: relative;
        background-color: #0b1524;
        overflow-y: auto;
        padding: 25px;
        box-sizing: border-box;
      }

      .tp-section-header {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--tp-white);
        margin: 0 0 20px 0;
        border-bottom: 1px solid rgba(34, 211, 238, 0.15);
        padding-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .tp-input-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        margin-bottom: 25px;
      }

      .tp-input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .tp-input-group label {
        font-size: 1.1rem;
        color: var(--tp-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .tp-field-input, .tp-select-field {
        background-color: var(--tp-navy-dark);
        border: 1px solid rgba(34, 211, 238, 0.2);
        color: var(--tp-white);
        padding: 10px 14px;
        font-size: 1.3rem;
        border-radius: 6px;
        outline: none;
        transition: border-color 0.2s;
      }
      .tp-field-input:focus, .tp-select-field:focus { border-color: var(--tp-cyan); }

      .tp-toggle-row { display: flex; gap: 10px; }
      .tp-toggle-btn {
        flex: 1; background-color: var(--tp-navy-dark); border: 1px solid rgba(255,255,255,0.1);
        color: var(--tp-muted); padding: 10px; font-size: 1.2rem; font-weight: 600; border-radius: 6px;
        cursor: pointer; transition: all 0.2s ease;
      }
      .tp-toggle-btn.active {
        background-color: rgba(34, 211, 238, 0.1); border-color: var(--tp-cyan); color: var(--tp-cyan);
      }

      .action-btn {
        width: 100%; font-size: 1.4rem; font-weight: 700; padding: 14px; border-radius: 6px;
        cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); border: none;
        margin-bottom: 15px; font-family: inherit;
      }
      .btn-scan { background-color: var(--tp-violet); color: var(--tp-white); box-shadow: 0 0 15px rgba(124, 58, 237, 0.2); }
      .btn-scan:hover { background-color: #6d28d9; box-shadow: 0 0 20px rgba(124, 58, 237, 0.4); }

      .tp-manual-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 10px; }
      .btn-manual {
        padding: 14px; font-size: 1.4rem; font-weight: 700; border-radius: 6px; cursor: pointer;
        border: none; color: var(--tp-white); font-family: inherit; transition: transform 0.1s ease;
      }
      .btn-manual:active { transform: scale(0.97); }
      .btn-rise { background-color: var(--tp-success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
      .btn-fall { background-color: var(--tp-red); box-shadow: 0 0 15px rgba(239, 68, 68, 0.2); }

      .tp-console-terminal {
        background-color: #030a17; border: 1px solid rgba(255,255,255,0.05); border-radius: 6px;
        padding: 15px; font-family: monospace; font-size: 1.1rem; color: #a4b3c6; height: 125px;
        overflow-y: auto; line-height: 1.6;
      }
      .log-entry { margin-bottom: 4px; }
      .log-sys { color: var(--tp-cyan); }
      .log-live { color: var(--tp-amber); }

      /* ==========================================================================
         LAYER 1: GATEWAY MASK CANVAS WITH PROFESSIONAL FOREX GRAPH ROOM BACKLAY
         ========================================================================== */
