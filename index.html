    <title>Automate Your Trades | Deriv Bot</title>
    <style>
      :root {
        font-size: 62.5%;
      }
      
      /* --- INTEGRATED GATEWAY CANVAS LAYER --- */
      .splash-overlay {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background: #0b0e14 !important; /* Premium dark interface backing */
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        z-index: 2147483647 !important; /* Forces layer above the app rendering pipeline */
      }

      .splash-content-box {
        text-align: center !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        gap: 20px !important;
        width: 90% !important;
        max-width: 340px !important;
        padding: 30px !important;
        box-sizing: border-box !important;
      }

      /* Animated Title Element */
      .animated-title {
        color: #ffffff !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        font-size: 3.6rem !important;
        font-weight: 800 !important;
        letter-spacing: 3px !important;
        text-transform: uppercase !important;
        margin: 0 0 10px 0 !important;
      }

      .animated-title span {
        color: #00ff87 !important; /* Cyber Neon Accent */
        text-shadow: 0 0 20px rgba(0, 255, 135, 0.7) !important;
      }

      /* Live Engine Progress Bar */
      .progress-container {
        width: 220px !important;
        height: 4px !important;
        background: rgba(255, 255, 255, 0.08) !important;
        border-radius: 10px !important;
        overflow: hidden !important;
        margin-bottom: 15px !important;
      }

      .progress-bar-fill {
        height: 100% !important;
        width: 0% !important;
        background: linear-gradient(90deg, #00ff87, #60efff) !important;
        box-shadow: 0 0 10px rgba(0, 255, 135, 0.5) !important;
        border-radius: 10px !important;
        animation: loadProgressEngine 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards !important;
      }

      /* --- UNCHANGED FUNCTIONAL NATIVE APP BUTTON STRIP --- */
      .auth-action-box {
        width: 100% !important;
        display: flex !important; 
        flex-direction: column !important;
        gap: 14px !important;
      }

      .gateway-btn {
        width: 100% !important;
        padding: 14px !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        font-size: 14px !important;
        font-weight: bold !important;
        border-radius: 6px !important;
        cursor: pointer !important;
        text-align: center !important;
        text-transform: uppercase !important;
        box-sizing: border-box !important;
        transition: all 0.2s ease !important;
      }

      /* Native Style Bindings matched exactly from original bot architecture templates */
      .btn-login {
        background: transparent !important;
        color: #ffffff !important;
        border: 2px solid #ffffff !important;
      }

      .btn-login:hover {
        background: rgba(255, 255, 255, 0.1) !important;
        border-color: #00ff87 !important;
        color: #00ff87 !important;
      }

      .btn-signup {
        background: #ff444f !important; 
        color: #ffffff !important;
        border: none !important;
      }

      .btn-signup:hover {
        background: #e03a43 !important;
        box-shadow: 0 0 15px rgba(255, 68, 79, 0.4) !important;
      }

      /* AI Utilities Sidebar Container Panel Module */
      .ai-extension-container {
        position: fixed;
        bottom: 100px;
        right: 20px;
        width: 320px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 9999;
        overflow: hidden;
        display: none; 
      }
      
      .ai-header {
        background: #111827; 
        color: white;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #00ff87;
      }
      .ai-body {
        padding: 16px;
      }
      .section-title {
        font-size: 12px;
        text-transform: uppercase;
        color: #6b7280;
        margin-bottom: 8px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .loader-zone {
        border: 2px dashed #00ff87;
        border-radius: 8px;
        padding: 16px;
        text-align: center;
        background: #fdfdfd;
        cursor: pointer;
        margin-bottom: 16px;
      }
      .loader-zone p {
        margin: 0;
        font-size: 12px;
        color: #4b5563;
      }
      .scanner-status {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 12px;
        font-size: 12px;
        color: #1f2937;
      }
      .scanner-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .badge {
        background: #00ff87;
        color: #0b0e14;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: bold;
      }
      .hidden-input {
        display: none;
      }

      @keyframes loadProgressEngine {
        0% { width: 0%; }
        100% { width: 100%; }
      }
    </style>
  </head>
  
  <body class="body theme theme--light">
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe src="https://googletagmanager.com" height="0" width="0" style="display: none; visibility: hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Tradingprint AI Core Entry Gateway -->
    <div id="splashScreen" class="splash-overlay">
      <div class="splash-content-box">
        <div class="animated-title">Tradingprint <span>AI</span></div>
        
        <!-- Processing Engine Status Light Sync Line -->
        <div id="loadingLine" class="progress-container">
          <div class="progress-bar-fill"></div>
        </div>

        <!-- Fully Intact Original App Actions Trigger Array -->
        <div id="authActions" class="auth-action-box">
          <button type="button" class="gateway-btn btn-login" onclick="triggerNativeAuth('login')">Log In</button>
          <button type="button" class="gateway-btn btn-signup" onclick="triggerNativeAuth('signup')">Sign Up Free</button>
        </div>
      </div>
    </div>
    
    <div id="modal_root" class="modal-root"></div>
    <div id="popup_root" class="popup-root"></div>
    <div id="root"></div>

    <!-- AI Scanner & Bot Loader Platform Dashboard Module Container -->
    <div class="ai-extension-container" id="aiPanel">
      <div class="ai-header">
        <span>🤖 Tradingprint AI Modules</span>
        <span style="font-size: 11px; color: #00ff87; font-weight: bold;">ONLINE</span>
      </div>
      <div class="ai-body">
        <!-- Bot Loader Section -->
        <div class="section-title">Strategy Engine Loader</div>
        <div class="loader-zone" onclick="document.getElementById('botFileInput').click()">
          <p>📄 <strong>Click to load strategy file</strong></p>
          <p style="font-size: 10px; color: #9ca3af; margin-top: 4px;">Supports XML or JSON bot configurations</p>
          <input type="file" id="botFileInput" class="hidden-input" accept=".xml,.json" onchange="handleBotUpload(this)">
        </div>

        <!-- AI Scanner Section -->
        <div class="section-title">AI Live Market Scanner</div>
        <div class="scanner-status">
          <div class="scanner-row">
            <span>Market Volatility:</span>
            <span style="font-weight: 600; color: #00e074;">Optimal</span>
          </div>
          <div class="scanner-row">
            <span>AI Signal Trend:</span>
            <span class="badge">STRONG BUY</span>
          </div>
          <div class="scanner-row">
            <span>Scan Accuracy:</span>
            <span style="color: #00e074; font-weight: 600;">94.2%</span>
          </div>
        </div>
      </div>
    </div>
