    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="title" content="Automate Your Trades | Tradingprint AI" />
    <meta name="description" content="Import your current bot or learn how to create a trading bot from scratch with our detailed guides, FAQs, and tutorials. Start with a quick strategy!" />

    <meta property="og:description" content="Import your current bot or learn how to create a trading bot from scratch with our detailed guides, FAQs, and tutorials. Start with a quick strategy!" />
    <title>Automate Your Trades | Tradingprint AI</title>
    
    <style>
      :root {
        font-size: 62.5%;
      }

      /* Outer Layer Top Navigation Overlay Wrapper */
      .outer-nav-layer {
        position: relative;
        z-index: 9999;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 24px;
        background-color: #ffffff;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Animated Title Styles */
      .animated-title {
        font-size: 2.2rem;
        font-weight: 700;
        color: #ff444f;
        margin: 0;
        letter-spacing: -0.5px;
        opacity: 0;
        transform: translateX(-15px);
        animation: slideInFade 1.2s ease-out forwards;
      }

      @keyframes slideInFade {
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      /* Button Layout Grouping */
      .auth-buttons-group {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      /* Base Style Rules for Outer Layer Interaction Elements */
      .nav-btn {
        font-size: 1.4rem;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
        border: 2px solid transparent;
      }

      .btn-login {
        color: #333333;
        background-color: transparent;
        border-color: #e5e5e5;
      }

      .btn-login:hover {
        background-color: #f5f5f5;
        border-color: #d0d0d0;
      }

      .btn-signin {
        color: #ffffff;
        background-color: #ff444f;
      }

      .btn-signin:hover {
        background-color: #eb3e48;
      }

      /* Seamless Moving Background Graph Component */
      .graph-container {
        position: relative;
        width: 100%;
        height: 60px;
        margin: 0;
        overflow: hidden;
        background-color: #ffffff;
        border-bottom: 1px solid rgba(0,0,0,0.05);
      }

      .moving-graph {
        width: 200%;
        height: 100%;
        animation: slideGraph 15s linear infinite;
      }

      @keyframes slideGraph {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
    </style>
  </head>
  
  <body class="body theme theme--light">
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe src="https://googletagmanager.com" height="0" width="0" style="display: none; visibility: hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <!-- Outer Layer Mask Element: Title, Login, and Sign In Buttons -->
    <header class="outer-nav-layer">
      <h1 class="animated-title">Tradingprint AI</h1>
      
      <div class="auth-buttons-group">
        <button class="nav-btn btn-login" onclick="redirectToDeriv('login')">Log in</button>
        <button class="nav-btn btn-signin" onclick="redirectToDeriv('signup')">Sign in</button>
      </div>
    </header>

    <!-- Slowly Moving Graphic Ribbon Right Under Navigation Layer -->
    <div class="graph-container">
      <svg class="moving-graph" viewBox="0 0 1000 60" preserveAspectRatio="none" xmlns="http://w3.org">
        <path d="M 0 40 Q 125 15 250 45 T 500 30 Q 625 15 750 45 T 1000 30" 
              fill="none" 
              stroke="#ff444f" 
              stroke-width="2" 
              stroke-dasharray="4,4"/>
      </svg>
    </div>

    <!-- Application Mounting Targets remain perfectly untouched below -->
    <div id="modal_root" class="modal-root"></div>
    <div id="popup_root" class="popup-root"></div>
    <div id="root"></div>

    <!-- Operational Script handling clean redirection state without App ID -->
    <script>
      function redirectToDeriv(action) {
        var currentUrl = window.location.origin + window.location.pathname;
        var tokenKey = "34sb2Kw5AaeoKYyYQZ4j6";
        
        if (action === 'login') {
          window.location.href = "https://deriv.com" + encodeURIComponent(currentUrl) + "&state=" + encodeURIComponent(tokenKey);
        } else if (action === 'signup') {
          window.location.href = "https://deriv.com";
        }
      }
    </script>

</html>
