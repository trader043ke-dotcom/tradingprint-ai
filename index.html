    <style>
      :root {
        font-size: 62.5%;
        --tp-bg: #081B33;
        --tp-navy-dark: #051224;
        --tp-cyan: #22D3EE;
        --tp-violet: #7C3AED;
        --tp-white: #F8FAFC;
        --tp-muted: #94A3B8;
        --tp-amber: #F59E0B;
        --tp-red: #EF4444;
        --tp-success: #10B981;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--tp-bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }

      .tp-main-interface-shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        position: relative;
        z-index: 10;
      }

      /* ==========================================================================
         OUTER LAYER: SYSTEM NAVIGATION BAR WITH BRANDING UPDATE
         ========================================================================= */
      .tp-header-navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 24px;
        background-color: var(--tp-navy-dark);
        border-bottom: 1px solid rgba(34, 211, 238, 0.25);
        box-sizing: border-box;
        position: relative;
        z-index: 100000;
      }

      .animated-title {
        font-size: 2.2rem;
        font-weight: 900;
        letter-spacing: -0.5px;
        margin: 0;
        background: linear-gradient(
          120deg, 
          var(--tp-cyan) 15%, 
          var(--tp-white) 40%, 
          var(--tp-violet) 65%, 
          var(--tp-cyan) 85%
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: tpTitleShimmer 4s linear infinite;
      }

      @-webkit-keyframes tpTitleShimmer {
        0% { background-position: 200% center; }
        100% { background-position: -200% center; }
      }
      @keyframes tpTitleShimmer {
        0% { background-position: 200% center; }
        100% { background-position: -200% center; }
      }

      .auth-buttons-group {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .nav-btn {
        font-size: 1.3rem;
        font-weight: 700;
        padding: 8px 18px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        text-decoration: none;
        border: 2px solid transparent;
        box-sizing: border-box;
      }

      .btn-login {
        color: var(--tp-white);
        background-color: transparent;
        border-color: rgba(248, 250, 252, 0.2);
      }
      .btn-login:hover {
        color: var(--tp-cyan);
        background-color: rgba(34, 211, 238, 0.05);
        border-color: var(--tp-cyan);
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.15);
      }

      .btn-signin {
        color: var(--tp-navy-dark);
        background-color: var(--tp-cyan);
      }
      .btn-signin:hover {
        background-color: #1ec2db;
        color: var(--tp-white);
        box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
        transform: translateY(-1px);
      }

      .tp-workspace-split-container {
        display: flex;
        flex: 1;
        width: 100%;
        overflow: hidden;
        height: calc(100vh - 59px);
      }

      /* ==========================================================================
         INNER SIDEBAR LAYER: PROFESSIONAL TRADING FLOOR STYLING
         ========================================================================== */
      .tp-ai-scanner-sidebar {
        width: 320px;
        background-color: var(--tp-navy-dark);
        border-right: 1px solid rgba(34, 211, 238, 0.15);
        display: flex;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
        flex-shrink: 0;
      }

      .sidebar-subtitle {
        font-size: 1.1rem;
        color: var(--tp-cyan);
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
      }

      .scanner-card {
        background: rgba(8, 27, 51, 0.6);
        border: 1px solid rgba(34, 211, 238, 0.2);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
      }

      .scanner-card h4 {
        margin: 0 0 12px 0;
        font-size: 1.3rem;
        color: var(--tp-white);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding-bottom: 5px;
      }

      .pulse-indicator {
        width: 8px;
        height: 8px;
        background-color: var(--tp-muted);
        border-radius: 50%;
      }
      .pulse-indicator.active {
        background-color: var(--tp-amber);
        box-shadow: 0 0 8px var(--tp-amber);
        animation: tpGlitchPulse 1.5s infinite;
      }
      @keyframes tpGlitchPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

      .metric-row {
        display: flex;
        justify-content: space-between;
        font-size: 1.1rem;
        margin-bottom: 8px;
        color: var(--tp-muted);
      }
      .metric-row span.v {
        color: var(--tp-white);
        font-weight: 600;
      }

      .action-btn {
        width: 100%;
        font-size: 1.3rem;
        font-weight: 700;
        padding: 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        border: 1.5px solid transparent;
        margin-bottom: 10px;
        box-sizing: border-box;
      }

      .btn-scan {
        background-color: var(--tp-violet);
        color: var(--tp-white);
        box-shadow: 0 0 10px rgba(124, 58, 237, 0.3);
      }
      .btn-scan:hover { 
        background-color: #6d28d9; 
        box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
      }

      .progress-container {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.05);
        border-radius: 2px;
        overflow: hidden;
        margin: 10px 0;
        display: none;
      }
      .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--tp-cyan), var(--tp-violet));
      }

      .result-box {
        margin-top: 10px;
        padding: 12px;
        border-radius: 6px;
        background: rgba(16, 185, 129, 0.05);
        border: 1px solid var(--tp-success);
        display: none;
        font-size: 1.2rem;
        text-align: center;
        box-shadow: 0 0 10px rgba(16, 185, 129, 0.1);
      }

      /* Inner Menu Dynamic Strategy Injector Styling */
      .tp-inner-menu-section {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        background-color: var(--tp-navy-dark);
      }
      
      .tp-inner-menu-header {
        font-weight: bold;
        color: var(--tp-cyan);
        padding: 8px 16px;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .tp-strategy-option-item {
        padding: 10px 16px;
        color: var(--tp-white);
        font-size: 1.2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
        border-left: 2px solid transparent;
      }
      .tp-strategy-option-item:hover {
        background-color: rgba(34, 211, 238, 0.08);
        color: var(--tp-cyan);
        border-left-color: var(--tp-violet);
        padding-left: 20px;
      }

      .tp-underlying-app-viewport {
        flex: 1;
        height: 100%;
        position: relative;
        background-color: var(--tp-white);
        overflow: auto;
      }

      @media (max-width: 768px) {
        .tp-workspace-split-container { flex-direction: column; }
        .tp-ai-scanner-sidebar { width: 100%; height: 35%; border-right: none; border-bottom: 1px solid rgba(34, 211, 238, 0.15); }
        .tp-underlying-app-viewport { height: 65%; }
      }

      /* ==========================================================================
         LAYER 1: GATEWAY MASK CANVAS WITH CORRESPONDING BRANDING UPDATE
         ========================================================================== */
      .tp-split-overlay {
        position: fixed;
        top: 59px;
        left: 0;
        width: 100%;
        height: calc(100% - 59px);
        background-color: var(--tp-bg);
