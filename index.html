    <title>Automate Your Trades | Tradingprint AI</title>
    <style>
      :root {
        font-size: 62.5%;
      }
      
      /* Vibrant Dashboard Container */
      .brand-header-dashboard {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        width: 100%;
        max-width: 650px;
        margin: 4rem auto 2rem auto;
        padding: 2.5rem;
        box-sizing: border-box;
        border-radius: 12px;
        background: #1C2026; /* Deriv Core Slate Gray Background */
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        perspective: 1000px; /* Enables 3D context for nested letter flips */
      }

      /* Animated Letter Segmented Title */
      .animated-bot-title {
        font-size: 4.6rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 4px;
        display: flex;
        gap: 0.2rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin-bottom: 2rem;
      }

      /* Base Letter Block with 3D Flip Entrance & Perpetual Slower Wave Animation */
      .animated-bot-title span {
        display: inline-block;
        opacity: 0;
        transform: translateY(30px) rotateY(90deg) scale(0.5);
        /* Slowed wave cycle down from 2.5s to 4.5s for a gentler, premium feel */
        animation: flipEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                  continuousWave 4.5s ease-in-out infinite alternate;
      }

      /* Individual Staggered Animation Delays for Layout Harmony */
      .letter-1  { animation-delay: 0.1s, 0.9s; }
      .letter-2  { animation-delay: 0.18s, 0.98s; }
      .letter-3  { animation-delay: 0.26s, 1.06s; }
      .letter-4  { animation-delay: 0.34s, 1.14s; }
      .letter-5  { animation-delay: 0.42s, 1.22s; }
      .letter-6  { animation-delay: 0.5s, 1.3s; }
      .letter-7  { animation-delay: 0.58s, 1.38s; }
      .letter-8  { animation-delay: 0.66s, 1.46s; }
      .letter-9  { animation-delay: 0.74s, 1.54s; }
      .letter-10 { animation-delay: 0.82s, 1.62s; }
      .letter-11 { animation-delay: 0.9s, 1.7s; }
      .letter-12 { animation-delay: 0.98s, 1.78s; }
      .letter-13 { animation-delay: 1.1s, 1.9s; }  /* letter A */
      .letter-14 { animation-delay: 1.18s, 1.98s; } /* letter I */

      /* Distribution of All Core Deriv Colors Across Text */
      .c-red    { color: #FF444F; text-shadow: 0 0 10px rgba(255, 68, 79, 0.3); }
      .c-blue   { color: #2196F3; text-shadow: 0 0 10px rgba(33, 150, 243, 0.3); }
      .c-yellow { color: #FFC03C; text-shadow: 0 0 10px rgba(255, 192, 60, 0.3); }
      .c-green  { color: #00B67A; text-shadow: 0 0 10px rgba(0, 182, 122, 0.3); }

      /* Spacing between brand phrases */
      .space-divider {
        margin-right: 1.5rem;
      }

      /* Multi-Color Multi-Layer Canvas Chart */
      .moving-graph-canvas {
        width: 100%;
        height: 100px;
        display: block;
        opacity: 0;
        animation: fadeInGraph 1.5s ease-out 1.4s forwards;
        margin-bottom: 1.5rem;
      }

      /* Brand Compliance Risk Tag Styling */
      .compliance-risk-tag {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 1.1rem;
        font-weight: 600;
        color: #FFC03C; /* Deriv Warning/Risk Gold Accent */
        background-color: rgba(255, 192, 60, 0.08);
        border: 1px solid rgba(255, 192, 60, 0.25);
        padding: 0.6rem 1.4rem;
        border-radius: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        opacity: 0;
        transform: translateY(10px);
        animation: fadeInRisk 1s ease-out 1.8s forwards;
      }

      .compliance-risk-tag::before {
        content: "⚠️";
        font-size: 1.2rem;
      }

      /* 3D Spin Entrance Keyframe */
      @keyframes flipEntrance {
        0% {
          opacity: 0;
          transform: translateY(30px) rotateY(90deg) scale(0.5);
        }
        100% {
          opacity: 1;
          transform: translateY(0) rotateY(0deg) scale(1);
        }
      }

      /* Continuous Floating Wave Breath Action (Slower Profile) */
      @keyframes continuousWave {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-5px);
        }
      }

      @keyframes fadeInGraph {
        0% { opacity: 0; transform: scaleY(0.7); }
        100% { opacity: 1; transform: scaleY(1); }
      }

      @keyframes fadeInRisk {
        0% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>

    <!-- Real-time Multi-Color Financial Vector Graph Engine -->
    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function() {
        const canvas = document.getElementById('liveMiniGraph');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        
        function resize() {
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        let pointsCount = 45;
        let lineRed = Array.from({ length: pointsCount }, () => 50);
        let lineBlue = Array.from({ length: pointsCount }, () => 45);
        let lineGreen = Array.from({ length: pointsCount }, () => 55);

        function animateGraph() {
          const w = canvas.getBoundingClientRect().width;
          const h = canvas.getBoundingClientRect().height;
          ctx.clearRect(0, 0, w, h);
          
          const variance = () => (Math.random() - 0.5) * 5;
          
          let lastR = lineRed[lineRed.length - 1];
          lineRed.push(Math.max(15, Math.min(h - 15, lastR + variance() + 0.2)));
          lineRed.shift();

          let lastB = lineBlue[lineBlue.length - 1];
          lineBlue.push(Math.max(15, Math.min(h - 15, lastB + variance() - 0.1)));
          lineBlue.shift();

          let lastG = lineGreen[lineGreen.length - 1];
          lineGreen.push(Math.max(15, Math.min(h - 15, lastG + variance() * 1.2)));
          lineGreen.shift();

          const step = w / (pointsCount - 1);

          function drawTrendLine(points, colorHex, strokeWidth) {
            ctx.beginPath();
            ctx.lineWidth = strokeWidth;
            ctx.strokeStyle = colorHex;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            for (let i = 0; i < points.length; i++) {
