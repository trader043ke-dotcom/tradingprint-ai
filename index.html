<html lang="en" dir="auto" class="light">
  <head>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="<%= assetPrefix %>/deriv-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="title" content="TradingPrint AI | Live Real-Money Trading Shell" />
    <meta name="description" content="Automated live trading interface powered by TradingPrint AI. Manage risks, deploy production strategies, and monitor real market conditions." />

    <meta property="og:description" content="Automated live trading interface powered by TradingPrint AI." />
    <title>TradingPrint AI | Live Real-Money Trading Bot</title>
    
    <style>
      :root {
        font-size: 62.5%;
        /* System Color Design Tokens */
        --tp-navy: #0e1626;
        --tp-cyan: #00bcd4;
        --tp-violet: #673ab7;
        --tp-amber: #ffc107;
        --tp-red: #ff444f;
        --tp-white: #ffffff;
        --tp-gray: #f4f5f6;
        --tp-dark-gray: #333333;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--tp-navy);
        color: var(--tp-white);
        overflow: hidden;
      }

      /* Risk Warning Header Banner */
      .risk-warning-banner {
        background-color: var(--tp-red);
        color: var(--tp-white);
        font-size: 1.1rem;
        font-weight: bold;
        text-align: center;
        padding: 6px 12px;
        position: relative;
        z-index: 10000;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Base Full-Screen Layout Wrapper */
      .outer-wrap-shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: calc(100vh - 28px);
        position: relative;
        z-index: 10;
      }

      /* Top Header Navigation Layer */
      .outer-nav-layer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        background-color: var(--tp-navy);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        box-sizing: border-box;
      }

      /* Animated Title Markup rules */
      .animated-title {
        font-size: 2rem;
        font-weight: 800;
        color: var(--tp-cyan);
        margin: 0;
        letter-spacing: -0.5px;
        opacity: 0;
        transform: translateX(-15px);
        animation: tpSlideInFade 1.2s ease-out forwards;
      }

      @keyframes tpSlideInFade {
        to { opacity: 1; transform: translateX(0); }
      }

      /* Navigation action buttons */
      .auth-buttons-group {
        display: flex;
        gap: 10px;
      }

      .nav-btn {
        font-size: 1.3rem;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1.5px solid transparent;
      }

      .btn-login {
        color: var(--tp-white);
        background-color: transparent;
        border-color: rgba(255,255,255,0.2);
      }
      .btn-login:hover { background-color: rgba(255,255,255,0.1); }

      .btn-signin {
        color: var(--tp-navy);
        background-color: var(--tp-cyan);
      }
      .btn-signin:hover { background-color: #0097a7; }

      /* Horizontal Scrolling Background Graph component rules */
      .graph-container {
        position: relative;
        width: 100%;
        height: 40px;
        margin: 0;
        overflow: hidden;
        background-color: rgba(14, 22, 38, 0.95);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .moving-graph {
        width: 200%;
        height: 100%;
        animation: tpSlideGraph 18s linear infinite;
      }

      @keyframes tpSlideGraph {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      /* Main Workspace: Split Dashboard Grid View */
      .main-workspace-grid {
        display: flex;
        flex: 1;
        width: 100%;
        overflow: hidden;
      }

      /* Left Side Dashboard Panels: Holds AI, Scanner and Recovery options */
      .sidebar-control-panel {
        width: 320px;
        background-color: #131d31;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding: 15px;
        box-sizing: border-box;
        gap: 15px;
      }

      /* Right Side Panel: Hosts untouched runtime bot containers safely */
      .bot-app-window {
        flex: 1;
        position: relative;
        background-color: var(--tp-white);
        overflow: auto;
      }

      /* UI Control Components Design rules */
      .panel-section {
        background-color: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 6px;
        padding: 12px;
      }

      .panel-section h4 {
        margin: 0 0 10px 0;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .panel-badge {
        font-size: 0.9rem;
        padding: 2px 6px;
        border-radius: 3px;
        font-weight: bold;
      }
      .badge-live { background-color: var(--tp-red); color: var(--tp-white); }
      .badge-violet { background-color: var(--tp-violet); color: var(--tp-white); }
      .badge-amber { background-color: var(--tp-amber); color: var(--tp-navy); }

      /* Form controls for Bounded Recovery view constraints */
      .input-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.1rem;
        margin-bottom: 8px;
        color: rgba(255, 255, 255, 0.7);
      }

      .input-row span.val {
        font-weight: bold;
        color: var(--tp-white);
      }

      .action-grid-buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
      }

      .utility-btn {
        background-color: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--tp-white);
        padding: 6px;
        font-size: 1.1rem;
        border-radius: 4px;
        cursor: pointer;
        text-align: left;
      }
      .utility-btn:hover { background-color: rgba(255,255,255,0.12); }

      /* Responsive rules for mobile screen limits */
      @media (max-width: 768px) {
        .main-workspace-grid { flex-direction: column; }
        .sidebar-control-panel { width: 100%; height: 280px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
      }
    </style>
  </head>
  
  <body class="body theme theme--light">
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe src="https://googletagmanager.com" height="0" width="0" style="display: none; visibility: hidden"></iframe>
    </noscript>

          </div>

          <!-- Section 5 & 6: AI Display Panel & Scanners -->
          <div class="panel-section">
            <h4>AI Panel Scanners <span class="panel-badge badge-violet">AUTOMATED</span></h4>
            <div class="action-grid-buttons">
