<head>

  <style> 
    :root { 
      font-size: 62.5%; 
      --deriv-color-yellow: #FFC03C;
      --theme-bg-canvas: radial-gradient(circle at center, #0f111a 0%, #05060a 100%); 
      --theme-font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    } 
    
    body {
      margin: 0; padding: 0; height: 100%;
      background: var(--theme-bg-canvas);
      font-family: var(--theme-font-stack);
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    
    .brand-canvas-container {
      text-align: center;
      max-width: 650px; width: 100%;
      padding: 4rem 3rem; box-sizing: border-box;
      perspective: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    /* Premium Metallic Goldish Title Presentation */
    .animated-bot-title {
      font-size: 5.8rem; font-weight: 900; text-transform: uppercase;
      letter-spacing: 7px; display: flex; justify-content: center; gap: 0.2rem;
      margin: 0 0 1.5rem 0;
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: metallicShine 6s linear infinite;
      filter: drop-shadow(0 4px 15px rgba(179, 135, 40, 0.2));
    }

    /* 3D Staggered Cascade Entrance & Continuous Slower Float Wave Loop */
    .animated-bot-title span {
      display: inline-block; opacity: 0;
      transform: translateY(25px) rotateX(-90deg);
      animation: flipEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                continuousWave 5s ease-in-out infinite alternate;
    }

    /* Timed Cascade Animation Delay Matrix */
    .l-1  { animation-delay: 0.05s, 0.85s; } .l-2  { animation-delay: 0.12s, 0.92s; }
    .l-3  { animation-delay: 0.19s, 0.99s; } .l-4  { animation-delay: 0.26s, 1.06s; }
    .l-5  { animation-delay: 0.33s, 1.13s; } .l-6  { animation-delay: 0.40s, 1.20s; }
    .l-7  { animation-delay: 0.47s, 1.27s; } .l-8  { animation-delay: 0.54s, 1.34s; }
    .l-9  { animation-delay: 0.61s, 1.41s; } .l-10 { animation-delay: 0.68s, 1.48s; }
    .l-11 { animation-delay: 0.75s, 1.55s; } .l-12 { animation-delay: 0.82s, 1.62s; }
    .space-break { margin-right: 2.5rem; }
    .l-13 { animation-delay: 0.92s, 1.72s; } .l-14 { animation-delay: 0.99s, 1.79s; }

    /* High-Performance Ticker Progress Pipeline Bar */
    .engine-progress-wrapper {
      width: 260px; height: 3px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px; position: relative;
      margin: 2rem 0 3rem 0; overflow: hidden;
      animation: hideProgressBar 0.4s ease forwards 2.6s;
    }

    .engine-progress-bar {
      position: absolute; top: 0; left: 0; height: 100%; width: 0%;
      background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728);
      box-shadow: 0 0 15px rgba(252, 246, 186, 0.6);
      animation: loadEngine 2s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.4s;
    }

    /* Typewriter Welcoming Section Wrapper Container */
    .welcome-text-node {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: 1.8px;
      margin-bottom: 3.5rem;
      min-height: 2.6rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Blended Typewriter Text Segment Colors */
    .w-gold  { color: #bf953f; text-shadow: 0 0 12px rgba(191, 149, 63, 0.3); }
    .w-white  { color: #fcf6ba; text-shadow: 0 0 12px rgba(252, 246, 186, 0.3); }
    .w-silver { color: #cbd5e1; text-shadow: 0 0 12px rgba(203, 213, 225, 0.2); }

    /* Flashing Terminal Cursor Accent */
    .typewriter-cursor {
      display: inline-block;
      width: 8px;
      height: 16px;
      background-color: #fcf6ba;
      margin-left: 5px;
      animation: cursorBlink 0.7s infinite;
    }

    /* Actions Cluster - Fades in dynamically inside the welcome section area */
    .auth-actions-group {
      display: flex; gap: 2.5rem; justify-content: center; width: 100%;
      margin-top: 1rem; height: 0; visibility: hidden; opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .auth-actions-group.active {
      opacity: 1; visibility: visible; height: auto; transform: translateY(0);
    }

    .btn-auth-node {
      padding: 1.5rem 4.5rem; font-size: 1.3rem; font-weight: 700;
      border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase;
      letter-spacing: 1.8px; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit; text-decoration: none; display: inline-block;
    }
    
    .btn-login { 
      background: linear-gradient(135deg, #d4af37 0%, #b38728 100%);
      color: #05060a;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(179, 135, 40, 0.3);
    }
    .btn-login:hover { 
      background: linear-gradient(135deg, #fcf6ba 0%, #d4af37 100%);
      box-shadow: 0 0 25px rgba(252, 246, 186, 0.5);
      transform: translateY(-2px);
    }
    
    .btn-signup { 
      background-color: rgba(255, 255, 255, 0.02); 
      color: #fcf6ba; 
      border: 1px solid rgba(191, 149, 63, 0.4); 
    }
    .btn-signup:hover { 
      background-color: rgba(191, 149, 63, 0.08); 
      border-color: #fcf6ba;
      color: #ffffff;
      transform: translateY(-2px);
    }
    .btn-auth-node:active { transform: translateY(0) scale(0.98); }

    /* Clean Pinned Risk Notice Baseline */
    .live-security-warning-box {
      font-size: 1.2rem; line-height: 1.7; color: rgba(255, 255, 255, 0.35);
      text-align: center; max-width: 520px;
      opacity: 0;
      animation: revealWarning 1s ease forwards 3s;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      padding-top: 2rem;
      width: 100%;
    }
    .live-security-warning-box strong { color: var(--deriv-color-yellow); font-weight: 600; }

    /* Advanced Interpolation Matrix Keyframes */
    @keyframes flipEntrance {
      to { opacity: 1; transform: translateY(0) rotateX(0deg); }
    }
    @keyframes continuousWave {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }
    @keyframes loadEngine {
      to { width: 100%; }
    }
    @keyframes hideProgressBar {
      to { opacity: 0; visibility: hidden; transform: scaleY(0); margin: 0; }
    }
    @keyframes revealWarning {
      to { opacity: 1; }
    }
    @keyframes metallicShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    @keyframes cursorBlink {
      50% { opacity: 0; }
    }
  </style> 
</head>
