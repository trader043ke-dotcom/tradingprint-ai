  <style> 
    :root { 
      font-size: 62.5%; 
      --deriv-color-yellow: #FFC03C;
      --theme-bg-canvas: #090a0f; /* Pure deep luxury onyx background */
      --theme-font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    } 
    
    body {
      margin: 0; padding: 0; height: 100%;
      background-color: var(--theme-bg-canvas);
      font-family: var(--theme-font-stack);
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    
    .brand-canvas-container {
      text-align: center;
      max-width: 650px; width: 100%;
      padding: 2rem; box-sizing: border-box;
      perspective: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Premium Metallic Goldish Title Presentation */
    .animated-bot-title {
      font-size: 5.6rem; font-weight: 900; text-transform: uppercase;
      letter-spacing: 6px; display: flex; justify-content: center; gap: 0.2rem;
      margin: 0 0 1rem 0;
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: metallicShine 6s linear infinite;
    }

    /* 3D Staggered Cascade Entrance & Continuous Slower Float Wave Loop */
    .animated-bot-title span {
      display: inline-block; opacity: 0;
      transform: translateY(20px) rotateX(-90deg);
      animation: flipEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                continuousWave 5s ease-in-out infinite alternate;
    }

    /* Timed Cascade Animation Delay Matrix */
    .l-1  { animation-delay: 0.05s, 0.85s; } .l-2  { animation-delay: 0.12s, 0.92s; }
    .l-3  { animation-delay: 0.19s, 0.99s; } .l-4  { animation-delay: 0.26s, 1.06s; }
    .l-5  { animation-delay: 0.33s, 1.13s; } .l-6  { animation-delay: 0.40s, 1.20s; }
    .l-7  { animation-delay: 0.47s, 1.27s; } .l-8  { animation-delay: 0.54s, 1.34s; }
    .l-9  { animation-delay: 0.61s, 1.41s; } .l-10 { animation-delay: 0.68s, 1.48s; }
    .l-11 { animation-delay: 0.75s, 1.55s; } .l-12 { animation-delay: 0.82s, 1.62s; }
    .space-break { margin-right: 2rem; }
    .l-13 { animation-delay: 0.92s, 1.72s; } .l-14 { animation-delay: 0.99s, 1.79s; }

    /* High-Performance Ticker Progress Pipeline Bar */
    .engine-progress-wrapper {
      width: 240px; height: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px; position: relative;
      margin: 2rem 0 3rem 0; overflow: hidden;
      animation: hideProgressBar 0.4s ease forwards 2.6s;
    }

    .engine-progress-bar {
      position: absolute; top: 0; left: 0; height: 100%; width: 0%;
      background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728);
      box-shadow: 0 0 10px rgba(252, 246, 186, 0.5);
      animation: loadEngine 2s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.4s;
    }

    /* Typewriter Welcoming Canvas Target Frame */
    .welcome-text-node {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      margin-bottom: 2.5rem;
      min-height: 2.4rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Blended Typewriter Text Segment Colors */
    .w-gold  { color: #bf953f; text-shadow: 0 0 8px rgba(191, 149, 63, 0.2); }
    .w-white  { color: #fcf6ba; text-shadow: 0 0 8px rgba(252, 246, 186, 0.2); }
    .w-silver { color: #e2e8f0; text-shadow: 0 0 8px rgba(226, 232, 240, 0.15); }

    /* Flashing Terminal Cursor Accent */
    .typewriter-cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #bf953f;
      margin-left: 4px;
      animation: cursorBlink 0.7s infinite;
    }

    /* Actions Cluster Positioned Directly Below Title & Welcome Tag */
    .auth-actions-group {
      display: flex; gap: 2rem; justify-content: center; width: 100%;
      margin-bottom: 4rem; height: 0; visibility: hidden; opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .auth-actions-group.active {
      opacity: 1; visibility: visible; height: auto; transform: translateY(0);
    }

    .btn-auth-node {
      padding: 1.4rem 4rem; font-size: 1.3rem; font-weight: 700;
      border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase;
      letter-spacing: 1.5px; transition: background 0.3s, transform 0.1s, box-shadow 0.3s;
      font-family: inherit; text-decoration: none; display: inline-block;
    }
    
    .btn-login { 
      background: linear-gradient(135deg, #bf953f 0%, #b38728 100%);
      color: #090a0f;
      font-weight: 800;
    }
    .btn-login:hover { 
      background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    }
    
    .btn-signup { background-color: transparent; color: #ffffff; border: 1px solid #c5a059; }
    .btn-signup:hover { background-color: rgba(191, 149, 63, 0.08); border-color: #fcf6ba; }
    .btn-auth-node:active { transform: scale(0.97); }

    /* Clean Pinned Risk Notice Baseline */
    .live-security-warning-box {
      font-size: 1.2rem; line-height: 1.6; color: rgba(255, 255, 255, 0.4);
      text-align: center; max-width: 500px;
      opacity: 0;
      animation: revealWarning 1s ease forwards 3s;
    }
    .live-security-warning-box strong { color: var(--deriv-color-yellow); font-weight: 600; }

    /* Advanced Interpolation Matrix Keyframes */
    @keyframes flipEntrance {
      to { opacity: 1; transform: translateY(0) rotateX(0deg); }
    }
    @keyframes continuousWave {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }
    @keyframes loadEngine {
      to { width: 100%; }
    }
    @keyframes hideProgressBar {
      to { opacity: 0; visibility: hidden; transform: scaleY(0); margin: 0; }
    }
    @keyframes revealWarning {
      to { opacity: 1; }
    }
    @keyframes metallicShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    @keyframes cursorBlink {
      50% { opacity: 0; }
    }
  </style> 
</head>
