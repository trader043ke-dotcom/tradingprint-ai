    <style>
      :root {
        font-size: 62.5%;
        --tp-bg: #081B33;
        --tp-navy-dark: #051224;
        --tp-cyan: #22D3EE;
        --tp-violet: #7C3AED;
        --tp-white: #F8FAFC;
        --tp-muted: #94A3B8;
        --tp-amber: #F59E0B;
        --tp-success: #10B981;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--tp-bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }

      /* ==========================================================================
         LAYER 1: OUTER LAYER MASK GATEWAY (TEMPLATED WITH FIXED ROUTING)
         ========================================================================== */
      .tp-outer-layer-mask {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--tp-bg);
        z-index: 99999;
        display: flex;
        box-sizing: border-box;
      }

      .tp-outer-layer-mask.authenticated-revealed {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.8s;
      }

      .tp-outer-anim-panel {
        flex: 1.2;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 60px;
        box-sizing: border-box;
        overflow: hidden;
      }

      .tp-outer-anim-panel::before {
        content: '';
        position: absolute;
        width: 160%;
        height: 160%;
        top: -30%;
        left: -30%;
        background: radial-gradient(circle at 20% 30%, var(--tp-violet) 0%, transparent 45%),
                    radial-gradient(circle at 80% 70%, var(--tp-cyan) 0%, transparent 50%),
                    radial-gradient(circle at 50% 20%, rgba(245, 158, 11, 0.3) 0%, transparent 40%);
        animation: morphBackgroundGrid 12s ease-in-out infinite alternate;
        z-index: 1;
      }

      @keyframes morphBackgroundGrid {
        0% { transform: translate(0, 0) rotate(0deg); }
        100% { transform: translate(5%, 10%) rotate(45deg); }
      }

      .tp-glass-tint-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(5, 18, 36, 0.78);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        z-index: 2;
      }

      .tp-outer-title-cluster {
        position: relative;
        z-index: 3;
        width: 100%;
      }

      .premium-title-sweep {
        font-size: 5.2rem;
        font-weight: 900;
        letter-spacing: -1.5px;
        margin: 0 0 15px 0;
        background: linear-gradient(120deg, var(--tp-cyan) 20%, var(--tp-white) 40%, var(--tp-violet) 60%, var(--tp-cyan) 80%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: liveTitleSweep 3.2s linear infinite;
        text-shadow: 0 0 30px rgba(34, 211, 238, 0.15);
      }

      @keyframes liveTitleSweep {
        0% { background-position: 200% center; }
        100% { background-position: -200% center; }
      }

      .chart-wave-container {
        width: 100%;
        max-width: 400px;
        height: 50px;
        margin-bottom: 25px;
        overflow: hidden;
      }

      .moving-graph-line {
        width: 200%;
        height: 100%;
        animation: continuousWave 12s linear infinite;
      }

      @keyframes continuousWave {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      .welcome-message-ticker {
        font-size: 1.8rem;
        font-weight: 500;
        color: var(--tp-cyan);
        min-height: 30px;
        letter-spacing: 0.5px;
        animation: textPulse 2.5s ease-in-out infinite;
      }

      @keyframes textPulse {
        0%, 100% { opacity: 0.7; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-2px); }
      }

      .tp-outer-auth-panel {
        flex: 0.8;
        background-color: var(--tp-navy-dark);
        border-left: 1px solid rgba(34, 211, 238, 0.15);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px;
        box-sizing: border-box;
        z-index: 3;
      }

      .auth-card {
        width: 100%;
        max-width: 320px;
        text-align: center;
      }

      .auth-card h3 {
        color: var(--tp-white);
        font-size: 2.4rem;
        margin-bottom: 12px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .auth-card p {
        color: var(--tp-muted);
        font-size: 1.3rem;
        margin-bottom: 30px;
        line-height: 1.6;
      }

      /* Functional Original Button Overlays */
      .tp-gateway-btn {
        width: 100%;
        font-size: 1.4rem;
        font-weight: 700;
        padding: 14px;
        border-radius: 6px;
        cursor: pointer;
        margin-bottom: 12px;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-sizing: border-box;
        border: 2px solid transparent;
        display: block;
        text-align: center;
        text-decoration: none;
      }

      .btn-gate-login {
        background-color: transparent;
        color: var(--tp-white);
        border-color: rgba(255, 255, 255, 0.15);
      }
      .btn-gate-login:hover {
        background-color: rgba(255, 255, 255, 0.03);
        border-color: var(--tp-white);
      }

      .btn-gate-signup {
        background-color: var(--tp-cyan);
        color: var(--tp-navy-dark);
      }
      .btn-gate-signup:hover {
        background-color: #1ec2db;
        color: var(--tp-white);
        box-shadow: 0 0 20px rgba(34, 211, 238, 0.35);
        transform: translateY(-1px);
      }

      @media (max-width: 768px) {
        .tp-outer-layer-mask { flex-direction: column; }
        .tp-outer-anim-panel { flex: 1; padding: 30px; align-items: center; text-align: center; }
        .tp-outer-auth-panel { flex: 1; padding: 30px; border-left: none; border-top: 1px solid rgba(34, 211, 238, 0.15); }
      }

      /* ==========================================================================
         LAYER 2: INNER LAYER WORKSPACE CANVAS
         ========================================================================== */
      .tp-inner-workspace-shell {
        display: flex;
        width: 100%;
        height: 100vh;
        position: relative;
        z-index: 10;
      }

      .tp-ai-scanner-sidebar {
        width: 320px;
        background-color: var(--tp-navy-dark);
        border-right: 1px solid rgba(34, 211, 238, 0.15);
        display: flex;
        flex-direction: column;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
        flex-shrink: 0;
      }

      .sidebar-subtitle {
        font-size: 1.1rem;
        color: var(--tp-muted);
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .scanner-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(34, 211, 238, 0.1);
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
      }

      .scanner-card h4 {
        margin: 0 0 12px 0;
        font-size: 1.3rem;
        color: var(--tp-white);
      }

      .metric-row {
        display: flex;
        justify-content: space-between;
        font-size: 1.1rem;
        margin-bottom: 8px;
        color: var(--tp-muted);
      }
      .metric-row span.v {
        color: var(--tp-white);
        font-weight: 600;
      }

      .action-btn {
        width: 100%;
        font-size: 1.3rem;
        font-weight: 700;
        padding: 12px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        background-color: var(--tp-violet);
        color: var(--tp-white);
        border: none;
        margin-bottom: 10px;
      }
      .action-btn:hover { background-color: #6d28d9; }

      .progress-container {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.05);
        border-radius: 2px;
        overflow: hidden;
        margin: 10px 0;
        display: none;
      }
      .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--tp-cyan), var(--tp-violet)); }
